services:
  - type: web
    name: financeflow-backend
    env: python
    rootDir: .
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      # No persistent disk, so use the default local ephemeral storage
      - key: DATABASE_URL
        value: sqlite:///financeflow.db
      - key: UPLOAD_DIR
        value: uploads
