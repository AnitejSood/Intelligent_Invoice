services:
  - type: web
    name: financeflow-backend
    env: python
    rootDir: .
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/data/financeflow.db
      - key: UPLOAD_DIR
        value: /opt/render/project/src/data/uploads
    disk:
      name: financeflow-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
